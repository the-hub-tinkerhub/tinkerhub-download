<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download The Hub — TinkerHub</title>
  <link rel="icon" href="icon.png" />
  <style>
    @font-face {
      font-family: 'Clash Display';
      src: url('fonts/clash-display-600.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Clash Display';
      src: url('fonts/clash-display-700.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'General Sans';
      src: url('fonts/general-sans-400.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'General Sans';
      src: url('fonts/general-sans-500.woff2') format('woff2');
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'General Sans';
      src: url('fonts/general-sans-600.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'General Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 28px 36px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 24px rgba(0, 0, 0, 0.07);
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    h1 {
      font-family: 'Clash Display', sans-serif;
      font-size: 26px;
      font-weight: 600;
      color: #111111;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .subtitle {
      font-family: 'General Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #888888;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      border-radius: 100px;
      font-family: 'Clash Display', sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .btn:active { opacity: 0.75; }

    .btn-primary {
      background: #111111;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .btn-secondary {
      background: transparent;
      color: #111111;
      border: 1.5px solid #111111;
    }

    .btn-secondary.hidden { display: none; }

    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 24px 0;
    }

    .redirect-note {
      font-family: 'General Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: #bbbbbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="icon.png" alt="The Hub" />
    </div>

    <h1>Download The Hub</h1>
    <p class="subtitle">The TinkerHub community app — events, programs, and your maker network.</p>

    <a id="btn-primary" class="btn btn-primary" href="https://app.tinkerhub.org">Download the app</a>
    <a id="btn-secondary" class="btn btn-secondary hidden" href="https://app.tinkerhub.org">Try another store</a>

    <div class="divider"></div>
    <p class="redirect-note" id="redirect-note">Taking you to the right store...</p>
  </div>

  <script>
    var ua        = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    var isIOS     = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    var playStore = "https://play.google.com/store/apps/details?id=com.hoomans.tinkerhub";
    var appStore  = "https://apps.apple.com/in/app/the-hub-of-tinkerhub/id6478268842";

    var primary   = document.getElementById("btn-primary");
    var secondary = document.getElementById("btn-secondary");
    var note      = document.getElementById("redirect-note");

    if (isAndroid) {
      primary.href          = playStore;
      primary.textContent   = "Get it on Google Play";
      secondary.href        = appStore;
      secondary.textContent = "Download on App Store instead";
      secondary.classList.remove("hidden");
      window.location.replace(playStore);
    } else if (isIOS) {
      primary.href          = appStore;
      primary.textContent   = "Download on the App Store";
      secondary.href        = playStore;
      secondary.textContent = "Get it on Google Play instead";
      secondary.classList.remove("hidden");
      window.location.replace(appStore);
    } else {
      primary.textContent = "Visit TinkerHub";
      primary.href        = "https://app.tinkerhub.org";
      note.textContent    = "Open this link on your phone to download the app.";
    }
  </script>
</body>
</html>
