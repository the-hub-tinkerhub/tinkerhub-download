<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download The Hub — TinkerHub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #000;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo span {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    p {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-primary {
      background: #000;
      color: #fff;
      margin-bottom: 12px;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .redirecting {
      font-size: 14px;
      color: #999;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>TH</span></div>
    <h1>Download The Hub</h1>
    <p>The TinkerHub community app — events, programs, and your maker network in one place.</p>

    <a id="primary-btn" class="btn btn-primary" href="https://app.tinkerhub.org">
      Download the app
    </a>
    <a id="secondary-btn" class="btn btn-secondary" href="https://app.tinkerhub.org" style="display:none;">
      Open another store
    </a>

    <p class="redirecting" id="redirect-msg">Taking you to the right store…</p>
  </div>

  <script>
    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    var playStore = "https://play.google.com/store/apps/details?id=com.hoomans.tinkerhub";
    var appStore  = "https://apps.apple.com/in/app/the-hub-of-tinkerhub/id6478268842";

    var primaryBtn   = document.getElementById("primary-btn");
    var secondaryBtn = document.getElementById("secondary-btn");
    var redirectMsg  = document.getElementById("redirect-msg");

    if (isAndroid) {
      primaryBtn.href        = playStore;
      primaryBtn.textContent = "Get it on Google Play";
      secondaryBtn.href      = appStore;
      secondaryBtn.textContent = "iOS App Store instead";
      secondaryBtn.style.display = "block";
      window.location.replace(playStore);
    } else if (isIOS) {
      primaryBtn.href        = appStore;
      primaryBtn.textContent = "Download on the App Store";
      secondaryBtn.href      = playStore;
      secondaryBtn.textContent = "Google Play instead";
      secondaryBtn.style.display = "block";
      window.location.replace(appStore);
    } else {
      primaryBtn.textContent  = "Visit TinkerHub";
      redirectMsg.textContent = "Open this link on your phone to download the app.";
    }
  </script>
</body>
</html>
